version: '3.8'

services:
  admin:
    image: ghcr.io/wittemberg/admin-ofertas-front:latest
    networks:
      - interna
    deploy:
      replicas: 1
      labels:
- "traefik.enable=true"
        - "traefik.http.routers.admin-ofertas.rule=Host(`admin-ofertas.wrtec.com.br`)"
        - "traefik.http.routers.admin-ofertas.entrypoints=websecure"
        - "traefik.http.routers.admin-ofertas.tls=true"
        - "traefik.http.routers.admin-ofertas.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.admin-ofertas.loadbalancer.server.port=80"
        - "traefik.http.routers.admin-ofertas-http.rule=Host(`admin-ofertas.wrtec.com.br`)"
        - "traefik.http.routers.admin-ofertas-http.entrypoints=web"
        - "traefik.http.routers.admin-ofertas-http.middlewares=redirect-https"
        - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"      update_config:
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  interna:
    external: true